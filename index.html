<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tickmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECF2E8; --sheet:#FAFCF8; --sheet-2:#F1F6EE; --rule:#D5E0CF; --rule-strong:#AFC3A6; --margin:#CF5D50;
  --ink:#17253A; --ink-2:#4A586A; --ink-3:#6E7B90; --tick:#1E6B39; --query:#2457A8; --cross:#B3261E;
  --tick-bg:#E0EEDD; --query-bg:#E3EAF7; --cross-bg:#F7E5E2; --btn:#17253A; --btn-text:#FAFCF8;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0F1512; --sheet:#161E19; --sheet-2:#1B241E; --rule:#27332B; --rule-strong:#3D4E43; --margin:#9B4038;
    --ink:#E3ECE1; --ink-2:#AAB8AD; --ink-3:#87958B; --tick:#73C98F; --query:#8DB1F2; --cross:#F2877D;
    --tick-bg:#1C2D21; --query-bg:#1C2537; --cross-bg:#341F1D; --btn:#E3ECE1; --btn-text:#0F1512;
    color-scheme:dark;
  }
}
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--paper); color:var(--ink); font:400 16px/1.55 "Public Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; }
button,input{ font:inherit; color:inherit; }
h1,h2,h3{ margin:0; line-height:1.2; }
[hidden]{ display:none !important; }
:focus-visible{ outline:2px solid var(--query); outline-offset:2px; border-radius:4px; }
.wrap{ max-width:760px; margin:0 auto; padding:0 20px; }

/* header */
header{ border-bottom:1px solid var(--rule-strong); }
header .wrap{ display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:64px; }
.brand{ display:flex; align-items:center; gap:9px; font-weight:800; font-size:21px; letter-spacing:-.015em; text-decoration:none; color:inherit; }
.brand svg{ width:28px; height:28px; color:var(--tick); }
.pill{ display:inline-flex; align-items:center; gap:7px; font-size:13.5px; color:var(--ink-2); padding:5px 11px; border:1px solid var(--rule-strong); border-radius:20px; background:var(--sheet); }
.pill i{ width:8px; height:8px; border-radius:50%; background:var(--ink-3); }
.pill.on i{ background:var(--tick); }

main.wrap{ padding-top:44px; padding-bottom:72px; }
.lead h1{ font-size:clamp(28px,5vw,36px); font-weight:800; letter-spacing:-.02em; margin-bottom:10px; }
.lead p{ color:var(--ink-2); margin:0 0 28px; font-size:17px; max-width:56ch; }

/* buttons */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:10px 20px; border-radius:8px; border:1.5px solid var(--btn); background:transparent; font-weight:600; cursor:pointer; text-decoration:none; color:var(--ink); }
.btn:hover{ background:var(--sheet-2); }
.btn.primary{ background:var(--btn); color:var(--btn-text); }
.btn.primary:hover{ filter:brightness(1.15); }
.btn.big{ min-height:52px; padding:12px 28px; font-size:17px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; filter:none; }
.link{ background:none; border:0; padding:6px 2px; color:var(--ink-2); text-decoration:underline; text-underline-offset:3px; cursor:pointer; font-weight:500; }
.link:hover{ color:var(--query); }

/* upload */
.uploads{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.drop{ position:relative; display:flex; flex-direction:column; gap:4px; padding:22px 22px 22px 64px; min-height:150px; border:1.5px dashed var(--rule-strong); border-radius:10px; background:var(--sheet); cursor:pointer; transition:border-color .15s, background .15s; }
.drop:hover,.drop.over{ border-color:var(--ink-2); background:var(--sheet-2); }
.drop:focus-within{ outline:2px solid var(--query); outline-offset:2px; }
.drop input{ position:absolute; width:1px; height:1px; opacity:0; }
.drop .num{ position:absolute; left:20px; top:20px; width:30px; height:30px; border-radius:50%; border:1.5px solid var(--ink-3); display:grid; place-items:center; font-weight:700; font-size:14px; color:var(--ink-2); }
.drop b{ font-size:17px; }
.drop .hint{ color:var(--ink-3); font-size:14px; }
.drop .choose{ margin-top:auto; padding-top:10px; font-weight:600; text-decoration:underline; text-underline-offset:3px; font-size:15px; }
.drop.has{ border-style:solid; border-color:var(--tick); }
.drop.has .num{ border-color:var(--tick); background:var(--tick); color:var(--sheet); }
.drop .fname{ margin-top:auto; padding-top:10px; font-weight:600; font-size:15px; word-break:break-all; color:var(--tick); }
.options{ margin:22px 0 0; }
.options summary{ cursor:pointer; color:var(--ink-2); font-weight:500; width:max-content; }
.options .box{ margin-top:12px; padding:16px 18px; background:var(--sheet); border:1px solid var(--rule); border-radius:8px; display:grid; gap:12px; }
.check{ display:flex; gap:10px; align-items:flex-start; cursor:pointer; }
.check input{ width:18px; height:18px; margin:3px 0 0; accent-color:var(--tick); }
.check small{ display:block; color:var(--ink-3); font-size:13.5px; }
.start{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-top:28px; }
.err{ color:var(--cross); font-size:14.5px; margin:14px 0 0; }

/* progress */
.steps{ list-style:none; margin:0; padding:0; background:var(--sheet); border:1px solid var(--rule-strong); border-radius:10px; overflow:hidden; }
.steps li{ display:grid; grid-template-columns:44px 1fr auto; align-items:center; gap:4px; padding:14px 18px 14px 8px; border-bottom:1px solid var(--rule); }
.steps li:last-child{ border-bottom:0; }
.steps .mk{ justify-self:center; width:26px; height:26px; }
.steps .lbl{ font-weight:500; }
.steps .det{ color:var(--ink-3); font-size:14px; text-align:right; }
.steps li.todo .lbl,.steps li.skipped .lbl{ color:var(--ink-3); }
.steps li.active{ background:var(--sheet-2); }
.steps li.active .lbl{ font-weight:600; }
.spin{ width:20px; height:20px; justify-self:center; border:2.5px solid var(--rule-strong); border-top-color:var(--query); border-radius:50%; animation:spin .8s linear infinite; }
.dot{ width:12px; height:12px; justify-self:center; border:1.5px solid var(--rule-strong); border-radius:50%; }
.dash{ width:14px; height:2px; justify-self:center; background:var(--rule-strong); }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* tick marks */
.mk path{ fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
.mk .fill{ fill:currentColor; stroke:none; }
.mk-tick{ color:var(--tick); } .mk-query{ color:var(--query); } .mk-cross{ color:var(--cross); } .mk-plus{ color:var(--ink-3); }
.draw path{ stroke-dasharray:60; stroke-dashoffset:60; animation:draw .4s ease-out forwards; }
@keyframes draw{ to{ stroke-dashoffset:0; } }
@media (prefers-reduced-motion: reduce){ .draw path{ animation:none; stroke-dashoffset:0; } .spin{ animation-duration:2.4s; } }

/* decision card */
.dhead{ display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin-bottom:12px; }
.dhead h1{ font-size:28px; font-weight:800; letter-spacing:-.015em; }
.count{ color:var(--ink-2); font-size:15px; }
.bar{ height:4px; background:var(--rule); border-radius:2px; margin-bottom:22px; overflow:hidden; }
.bar span{ display:block; height:100%; background:var(--tick); transition:width .3s; }
.slip{ position:relative; background:var(--sheet); border:1px solid var(--rule-strong); border-radius:4px; padding:24px 26px 22px 70px; box-shadow:0 2px 0 var(--rule); }
.slip::before{ content:""; position:absolute; top:0; bottom:0; left:48px; width:4px; border-left:1px solid var(--margin); border-right:1px solid var(--margin); }
.slip .stamp{ position:absolute; left:8px; top:22px; width:34px; height:34px; }
.slip .top{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; color:var(--ink-2); font-size:15px; }
.slip .amt{ font-size:26px; font-weight:700; color:var(--ink); }
.slip .amt small{ font-size:14px; font-weight:500; color:var(--ink-3); margin-left:4px; }
.slip .desc{ font-size:19px; font-weight:600; margin:4px 0 18px; word-break:break-word; }
.sugg{ padding:12px 14px; border-radius:6px; background:var(--query-bg); margin-bottom:16px; }
.sugg .what{ font-weight:600; }
.sugg .how{ font-size:14px; color:var(--ink-2); }
.why{ margin:0 0 14px; padding-left:20px; color:var(--ink-2); font-size:15px; }
.why li{ margin-bottom:5px; }
.je summary{ cursor:pointer; color:var(--ink-2); font-size:14.5px; font-weight:500; width:max-content; }
.je table{ width:100%; border-collapse:collapse; font-size:14px; margin-top:8px; }
.je td{ padding:6px 8px 6px 0; border-bottom:1px solid var(--rule); }
.je td.n{ text-align:right; white-space:nowrap; }
.je .cr td:first-child{ padding-left:18px; }
.acts{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:20px; }
.acts .btn{ min-width:120px; }
.after{ display:flex; gap:18px; flex-wrap:wrap; margin-top:16px; align-items:center; }
.keys{ color:var(--ink-3); font-size:13px; margin-left:auto; }
kbd{ font:inherit; font-size:12px; border:1px solid var(--rule-strong); border-bottom-width:2px; border-radius:4px; padding:0 5px; background:var(--sheet); }

/* done */
.stats{ display:grid; grid-template-columns:repeat(4,1fr); border-top:2px solid var(--ink); border-bottom:1px solid var(--rule-strong); margin:26px 0; }
.stat{ padding:14px 14px 12px 0; border-right:1px solid var(--rule); }
.stat + .stat{ padding-left:16px; }
.stat:last-child{ border-right:0; }
.stat b{ display:block; font-size:30px; font-weight:700; line-height:1.1; }
.stat span{ font-size:14px; color:var(--ink-2); }
.stat.warn b{ color:var(--cross); }
.note{ border-left:3px solid var(--query); background:var(--sheet); padding:12px 16px; margin:0 0 26px; color:var(--ink-2); font-size:15.5px; }
.note b{ display:block; color:var(--ink); font-size:14px; margin-bottom:4px; }
.dl{ display:flex; gap:6px 18px; flex-wrap:wrap; align-items:center; margin-bottom:34px; }
.dl a.link{ color:var(--ink-2); }
h2{ font-size:20px; font-weight:700; margin-bottom:10px; }
.tabs{ display:flex; gap:4px; margin-bottom:10px; }
.tabs button{ background:none; border:0; padding:7px 12px; border-radius:6px; cursor:pointer; color:var(--ink-2); font-weight:500; }
.tabs button[aria-pressed="true"]{ background:var(--sheet); color:var(--ink); font-weight:600; box-shadow:inset 0 0 0 1px var(--rule-strong); }
.lines{ background:var(--sheet); border:1px solid var(--rule-strong); border-radius:8px; overflow:hidden; }
.line{ border-bottom:1px solid var(--rule); }
.line:last-child{ border-bottom:0; }
.line > button{ display:grid; grid-template-columns:36px 64px minmax(0,1fr) auto; gap:8px; align-items:center; width:100%; padding:11px 14px 11px 6px; background:none; border:0; text-align:left; cursor:pointer; }
.line > button:hover{ background:var(--sheet-2); }
.line .mk{ width:22px; height:22px; justify-self:center; }
.line .d{ color:var(--ink-3); font-size:14px; white-space:nowrap; }
.line .t{ min-width:0; }
.line .t div{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.line .t .sub{ font-size:14px; color:var(--ink-2); }
.line.s-unresolved .sub{ color:var(--cross); } .line.s-waiting .sub{ color:var(--query); }
.line .a{ font-weight:600; white-space:nowrap; text-align:right; }
.line .a.out{ color:var(--ink-2); }
.line .more{ padding:0 18px 14px 106px; font-size:14.5px; color:var(--ink-2); }
.line .more ul{ margin:0; padding-left:18px; }
.empty{ padding:22px; color:var(--ink-2); text-align:center; }
.again{ margin-top:30px; }
.warns{ font-size:14px; color:var(--ink-2); margin:0 0 20px; padding-left:18px; }

@media (max-width: 640px){
  main.wrap{ padding-top:28px; }
  .uploads{ grid-template-columns:1fr; }
  .stats{ grid-template-columns:1fr 1fr; }
  .stat:nth-child(2){ border-right:0; }
  .stat:nth-child(3){ padding-left:0; }
  .stat:nth-child(n+3){ border-top:1px solid var(--rule); }
  .slip{ padding:20px 18px 18px 56px; }
  .slip::before{ left:38px; }
  .slip .stamp{ left:3px; width:30px; height:30px; }
  .line > button{ grid-template-columns:32px minmax(0,1fr) auto; }
  .line .d{ display:none; }
  .line .more{ padding-left:44px; }
  .keys{ display:none; }
  .steps .det{ display:none; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="/" aria-label="Tickmark home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 17.5c2.2 1.8 4.2 4.2 6 7.2C14.8 15.8 20 9.4 27 4.8" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Tickmark
    </a>
    <span class="pill" id="aiPill" hidden><i></i><span></span></span>
  </div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Math.abs(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const day = d => d ? `${+d.slice(8,10)} ${MON[+d.slice(5,7)-1]} ${d.slice(0,4)}` : '';
const shortDay = d => d ? `${+d.slice(8,10)} ${MON[+d.slice(5,7)-1]}` : '';
const MARKS = {
  tick: '<path d="M4.5 12.8c1.7 1.4 3.1 3.1 4.4 5.3C11.8 12.2 15.4 7.8 20 4.6"/>',
  query: '<path d="M8.6 8.4c.3-2.3 2.2-3.8 4.4-3.6 2.4.2 3.9 2.1 3.5 4.1-.4 2.3-2.7 2.9-3.7 4.5-.4.7-.5 1.5-.5 2.4"/><circle class="fill" cx="12.3" cy="19.3" r="1.25"/>',
  cross: '<path d="M6.2 6.4c4 3.6 8.1 7.8 11.9 11.8"/><path d="M17.6 5.9c-4.1 3.8-7.9 8-11.2 12.4"/>',
  plus: '<path d="M12 4.1c4.4-.1 8 3.5 7.9 7.9 0 4.4-3.6 7.9-8 7.9-4.3 0-7.8-3.6-7.7-8 0-4.3 3.5-7.7 7.8-7.8z"/><path d="M12 8.2v7.7M8.2 12.1h7.6"/>',
};
const mark = (k, cls = '', label = '') => `<svg class="mk mk-${k} ${cls}" viewBox="0 0 24 24" ${label ? `role="img" aria-label="${esc(label)}"` : 'aria-hidden="true"'}>${MARKS[k]}</svg>`;
const OUTCOME = {matched: ['tick', 'Matched'], suspense: ['plus', 'In suspense'], waiting: ['query', 'Waiting for you'], unresolved: ['cross', 'Not resolved']};
const confWord = c => c >= 80 ? 'high confidence' : c >= 60 ? 'medium confidence' : 'low confidence';

const S = { info: null, files: {bank: null, ledger: null}, useAI: true, auto: false, runId: null, snap: null,
            items: [], idx: 0, answers: {}, timer: null, filter: 'attention', open: new Set(), drawn: new Set(), error: '' };

/* ---------- API ---------- */
async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(body.detail || `Request failed (${r.status})`), {status: r.status});
  return body;
}
async function loadInfo() {
  try { S.info = await api('/api/info'); } catch { S.info = {ai_ready: false, reason: 'server not reachable', samples: false}; }
  S.useAI = S.info.ai_ready;
  const pill = $('#aiPill');
  pill.hidden = false;
  pill.classList.toggle('on', S.info.ai_ready);
  pill.querySelector('span').textContent = S.info.ai_ready ? 'AI ready' : 'AI off';
  pill.title = S.info.ai_ready ? 'AI reconciliation enabled' : S.info.reason;
}
async function startRun(sample) {
  S.error = '';
  const fd = new FormData();
  fd.append('use_ai', S.useAI); fd.append('auto', S.auto);
  try {
    let res;
    if (sample) res = await api('/api/runs/sample', {method: 'POST', body: fd});
    else { fd.append('bank', S.files.bank); fd.append('ledger', S.files.ledger); res = await api('/api/runs', {method: 'POST', body: fd}); }
    S.runId = res.id; location.hash = 'run=' + res.id;
    S.snap = {status: 'running', steps: [], files: sample ? {bank: 'sample statement', ledger: 'sample ledger'} : {bank: S.files.bank.name, ledger: S.files.ledger.name}};
    render(); poll();
  } catch (e) { S.error = e.message; render(); }
}
function poll() {
  clearTimeout(S.timer);
  S.timer = setTimeout(async () => {
    try {
      const snap = await api(`/api/runs/${S.runId}`);
      const was = S.snap && S.snap.status;
      S.snap = snap;
      if (snap.status === 'waiting' && was !== 'waiting') { S.items = snap.pending; S.idx = 0; S.answers = {}; }
      render();
      if (snap.status === 'running') poll();
    } catch (e) {
      if (e.status === 404) { S.runId = null; history.replaceState(null, '', '/'); S.error = e.message; S.snap = null; render(); }
      else poll();
    }
  }, 700);
}
async function sendAnswers() {
  try {
    await api(`/api/runs/${S.runId}/decisions`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({answers: S.answers})});
    S.snap.status = 'running'; render(); poll();
  } catch (e) { S.error = e.message; render(); }
}

/* ---------- screens ---------- */
function render() {
  const app = $('#app');
  if (!S.snap) app.innerHTML = startScreen();
  else if (S.snap.status === 'running') app.innerHTML = workingScreen();
  else if (S.snap.status === 'waiting') app.innerHTML = decideScreen();
  else if (S.snap.status === 'done') app.innerHTML = doneScreen();
  else app.innerHTML = errorScreen();
  if (S.snap && S.snap.status === 'waiting') { const b = $('[data-act="approve"]'); if (b) b.focus({preventScroll: true}); }
}

function startScreen() {
  const tile = (kind, n, title, hint, accept) => {
    const f = S.files[kind];
    return `<label class="drop${f ? ' has' : ''}" data-drop="${kind}">
      <input type="file" accept="${accept}" data-file="${kind}">
      <span class="num">${f ? '✓' : n}</span><b>${title}</b><span class="hint">${hint}</span>
      ${f ? `<span class="fname">${esc(f.name)}</span>` : '<span class="choose">Choose file or drop it here</span>'}
    </label>`;
  };
  const ready = S.files.bank && S.files.ledger;
  const i = S.info || {};
  return `<div class="lead"><h1>Reconcile your bank statement</h1>
    <p>Add your bank statement and your ledger. Tickmark matches every payment it can and only asks you about the rest.</p></div>
    <div class="uploads">
      ${tile('bank', 1, 'Bank statement', 'PDF, Excel or CSV from your bank', '.pdf,.csv,.txt,.xlsx,.xlsm')}
      ${tile('ledger', 2, 'Ledger', 'Open invoices and bills, as Excel or CSV', '.csv,.txt,.xlsx,.xlsm')}
    </div>
    <details class="options"><summary>Options</summary><div class="box">
      <label class="check"><input type="checkbox" id="optAI" ${S.useAI ? 'checked' : ''} ${i.ai_ready ? '' : 'disabled'}>
        <span>Let AI check the hard cases<small>${i.ai_ready ? 'Uses AI for payments the rules can’t match.' : `Unavailable: ${esc(i.reason || 'no API key')}. Add your key to .env and restart.`}</small></span></label>
      <label class="check"><input type="checkbox" id="optAuto" ${S.auto ? 'checked' : ''}>
        <span>Approve confident AI matches for me<small>You’ll still decide anything the AI isn’t sure about.</small></span></label>
    </div></details>
    <div class="start">
      <button class="btn primary big" data-act="start" ${ready ? '' : 'disabled'}>Start reconciliation</button>
      ${i.samples ? '<button class="link" data-act="sample">or try it with sample files</button>' : ''}
    </div>
    ${S.error ? `<p class="err" role="alert">${esc(S.error)}</p>` : ''}`;
}

function workingScreen() {
  const s = S.snap;
  const rows = (s.steps.length ? s.steps : [{label: 'Starting', active: true}]).map(st => {
    const cls = st.done ? 'done' : st.skipped ? 'skipped' : st.active ? 'active' : st.waiting ? 'active' : 'todo';
    const fresh = st.done && !S.drawn.has(st.key);
    if (fresh) S.drawn.add(st.key);
    const icon = st.done ? mark('tick', fresh ? 'draw' : '') : st.skipped ? '<span class="dash"></span>' : st.active ? '<span class="spin" aria-hidden="true"></span>' : '<span class="dot"></span>';
    return `<li class="${cls}">${icon}<span class="lbl">${esc(st.label)}</span><span class="det">${esc(st.skipped && !st.detail ? 'Not needed' : st.detail || '')}</span></li>`;
  }).join('');
  return `<div class="lead"><h1>Working on it</h1><p>${esc(s.files.bank)} against ${esc(s.files.ledger)}. This usually takes under a minute.</p></div>
    <ol class="steps">${rows}</ol>`;
}

function decideScreen() {
  const items = S.items, it = items[S.idx];
  if (!it) return workingScreen();
  const line = it.line || {};
  const done = Object.keys(S.answers).length;
  const ai = line.source === 'ai';
  const why = (it.explanation || []).filter(x => !x.startsWith('Confirm before')).slice(0, 3);
  const lines = it.lines.map(l => `<tr class="${l.credit ? 'cr' : ''}"><td>${esc(l.account)}${l.party ? ` <span style="color:var(--ink-3)">${esc(l.party)}${l.ref ? ' ' + esc(l.ref) : ''}</span>` : ''}</td><td class="n">${l.debit ? 'Dr ' + money(l.debit) : ''}</td><td class="n">${l.credit ? 'Cr ' + money(l.credit) : ''}</td></tr>`).join('');
  const what = line.matched_to ? `Match to ${line.matched_to}` : it.memo;
  return `<div class="dhead"><h1>Your decisions</h1><span class="count">${S.idx + 1} of ${items.length}</span></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${items.length}" aria-valuenow="${done}"><span style="width:${done / items.length * 100}%"></span></div>
    <article class="slip" aria-label="Decision ${S.idx + 1} of ${items.length}">
      <span class="stamp" id="stamp"></span>
      <div class="top"><span>${day(it.date)}</span><span class="amt">${money(it.amount)}<small>${it.amount > 0 ? 'in' : 'out'}</small></span></div>
      <div class="desc">${esc(it.description)}</div>
      <div class="sugg"><div class="what">${esc(what)}</div>
        <div class="how">${ai ? 'Suggested by AI' : esc(line.method || '')}${line.confidence ? `, ${confWord(line.confidence)}` : ''}</div></div>
      ${why.length ? `<ul class="why">${why.map(w => `<li>${esc(w.replace(/^Claude: /, ''))}</li>`).join('')}</ul>` : ''}
      <details class="je"><summary>Show the journal entry</summary><table>${lines}</table></details>
      <div class="acts">
        <button class="btn primary" data-act="approve">Approve</button>
        <button class="btn" data-act="reject">Reject</button>
        <button class="link" data-act="skip">Skip for now</button>
      </div>
    </article>
    <div class="after">
      ${S.idx > 0 ? '<button class="link" data-act="undo">Undo last</button>' : ''}
      <button class="link" data-act="all">Approve all remaining</button>
      <button class="link" data-act="later">Decide the rest later</button>
      <span class="keys"><kbd>A</kbd> approve <kbd>R</kbd> reject <kbd>S</kbd> skip</span>
    </div>
    ${S.error ? `<p class="err" role="alert">${esc(S.error)}</p>` : ''}`;
}

function doneScreen() {
  const s = S.snap, m = s.summary || {};
  const attention = (s.lines || []).filter(l => l.outcome !== 'matched');
  const shown = S.filter === 'attention' ? attention : (s.lines || []);
  const mainDl = (s.downloads || []).find(d => d.key === 'approved_entries');
  const otherDl = (s.downloads || []).filter(d => d.key !== 'approved_entries');
  const rows = shown.map(l => {
    const open = S.open.has(l.id);
    const [mk, label] = OUTCOME[l.outcome];
    const sub = l.status === 'unmatched' ? 'Couldn’t match'
      : l.outcome === 'suspense' ? 'Parked in suspense'
      : (l.matched_to || l.method) + (l.je_status === 'rejected' ? ', rejected by you' : l.outcome === 'waiting' ? ', waiting for you' : l.approved_by === 'person' ? ', approved by you' : '');
    const note = l.note && !/^AI (match applied|classified)/.test(l.note) ? l.note : '';
    return `<div class="line s-${l.outcome}"><button data-act="line" data-id="${l.id}" aria-expanded="${open}">
      ${mark(mk, '', label)}<span class="d">${shortDay(l.date)}</span>
      <span class="t"><div>${esc(l.description)}</div><div class="sub">${esc(sub)}</div></span>
      <span class="a${l.amount < 0 ? ' out' : ''}">${l.amount < 0 ? '−' : ''}${money(l.amount)}</span></button>
      ${open ? `<div class="more"><ul>${l.reasons.map(r => `<li>${esc(r.replace(/^Claude: /, 'AI: '))}</li>`).join('')}</ul>${l.suggestion ? `<p style="margin:8px 0 0"><b>Next step:</b> ${esc(l.suggestion)}</p>` : ''}${note ? `<p style="margin:8px 0 0">${esc(note)}.</p>` : ''}</div>` : ''}
    </div>`;
  }).join('') || `<p class="empty">Nothing needs your attention.</p>`;
  const period = s.period ? `${day(s.period[0])} to ${day(s.period[1])}` : '';
  return `<div class="lead" style="margin-bottom:0"><h1>Reconciliation complete</h1>
      <p style="margin:0">${esc(period)}, ${m.lines} bank lines. ${m.approved} journal ${m.approved === 1 ? 'entry is' : 'entries are'} approved and ready to download.</p></div>
    <div class="stats">
      <div class="stat"><b>${m.matched}</b><span>Matched</span></div>
      <div class="stat"><b>${m.suspense}</b><span>In suspense</span></div>
      <div class="stat"><b>${m.waiting}</b><span>Waiting for you</span></div>
      <div class="stat${m.unresolved ? ' warn' : ''}"><b>${m.unresolved}</b><span>Not resolved</span></div>
    </div>
    ${s.narrative ? `<div class="note"><b>Note from the AI</b>${esc(s.narrative)}</div>` : ''}
    ${s.warnings && s.warnings.length ? `<ul class="warns">${s.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
    <div class="dl">
      ${mainDl ? `<a class="btn primary" href="/api/runs/${S.runId}/files/approved_entries" download>Download approved entries</a>` : ''}
      ${otherDl.map(d => `<a class="link" href="/api/runs/${S.runId}/files/${d.key}" download>${esc(d.label)}</a>`).join('')}
    </div>
    <h2>Bank lines</h2>
    <div class="tabs">
      <button data-act="filter" data-f="attention" aria-pressed="${S.filter === 'attention'}">Needs attention (${attention.length})</button>
      <button data-act="filter" data-f="all" aria-pressed="${S.filter === 'all'}">All (${(s.lines || []).length})</button>
    </div>
    <div class="lines">${rows}</div>
    <div class="again"><button class="btn" data-act="new">Start a new reconciliation</button></div>`;
}

function errorScreen() {
  return `<div class="lead"><h1>That didn’t work</h1><p>${esc(S.snap.error || 'Something went wrong.')}</p></div>
    <button class="btn primary" data-act="new">Try again</button>`;
}

/* ---------- actions ---------- */
function decide(kind) {
  const it = S.items[S.idx]; if (!it) return;
  S.answers[it.je_id] = kind;
  const stamp = $('#stamp');
  const next = () => { S.idx++; if (S.idx >= S.items.length) sendAnswers(); else render(); };
  if (stamp && kind !== 'skip' && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    stamp.innerHTML = mark(kind === 'approve' ? 'tick' : 'cross', 'draw'); setTimeout(next, 380);
  } else next();
}
function finishWith(kind) {
  for (const it of S.items.slice(S.idx)) S.answers[it.je_id] = kind;
  S.idx = S.items.length; sendAnswers();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  switch (b.dataset.act) {
    case 'start': startRun(false); break;
    case 'sample': startRun(true); break;
    case 'approve': decide('approve'); break;
    case 'reject': decide('reject'); break;
    case 'skip': decide('skip'); break;
    case 'undo': S.idx--; delete S.answers[S.items[S.idx].je_id]; render(); break;
    case 'all': finishWith('approve'); break;
    case 'later': finishWith('skip'); break;
    case 'filter': S.filter = b.dataset.f; render(); break;
    case 'line': { const id = b.dataset.id; S.open.has(id) ? S.open.delete(id) : S.open.add(id); render(); const nb = document.querySelector(`[data-act="line"][data-id="${id}"]`); if (nb) nb.focus(); break; }
    case 'new': S.snap = null; S.runId = null; S.files = {bank: null, ledger: null}; S.error = ''; S.open.clear(); history.replaceState(null, '', '/'); render(); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-file]') && t.files[0]) { S.files[t.dataset.file] = t.files[0]; S.error = ''; render(); }
  if (t.id === 'optAI') S.useAI = t.checked;
  if (t.id === 'optAuto') S.auto = t.checked;
});
document.addEventListener('keydown', e => {
  if (!S.snap || S.snap.status !== 'waiting' || e.metaKey || e.ctrlKey || e.altKey || /input|textarea/i.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === 'a') decide('approve'); else if (k === 'r') decide('reject'); else if (k === 's') decide('skip');
});
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { const z = e.target.closest && e.target.closest('[data-drop]'); e.preventDefault(); if (z) z.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest && e.target.closest('[data-drop]'); e.preventDefault();
  if (!z) return; z.classList.remove('over');
  if (ev === 'drop' && e.dataTransfer.files[0]) { S.files[z.dataset.drop] = e.dataTransfer.files[0]; S.error = ''; render(); }
}));

/* ---------- start ---------- */
(async () => {
  await loadInfo();
  const m = location.hash.match(/^#run=(\w+)$/);
  if (m) { S.runId = m[1]; S.snap = {status: 'running', steps: [], files: {bank: '', ledger: ''}}; poll(); }
  render();
})();
</script>
</body>
</html>
